name: Phoneal CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  test:
    name: Format, lint, build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --locked --all-targets --all-features
      - name: Build
        run: cargo build --locked
      - name: Check language examples
        run: bash scripts/check_examples.sh
      - name: Test
        run: cargo test --locked
      - name: Publish verification status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ job.status }}
        run: |
          if [ "$RESULT" = "success" ]; then
            state=success
            description="All Phoneal checks passed"
          else
            state=failure
            description="One or more Phoneal checks failed"
          fi
          gh api "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \\
            --method POST \\
            --field state="$state" \\
            --field context="Phoneal CI" \\
            --field description="$description" \\
            --field target="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
